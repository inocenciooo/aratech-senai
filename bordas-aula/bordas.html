<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="borda.css">

    <title>Aprendendo Bordas</title>
</head>

<body>
    <h1>Estilos de Borda</h1>
    <div class="solid">
        <p class="borda">1</p>

        <p class="borda">4</p>

</html>
